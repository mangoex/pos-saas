# SEC001-SYNTHETIC-FIXTURE provenance=restaurantos-local-compose-v1
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      RESTAURANTOS_ENVIRONMENT: local
      RESTAURANTOS_SERVICE_NAME: restaurant-os-api
      RESTAURANTOS_DATABASE_URL: postgresql+psycopg://restaurantos:restaurantos@postgres:5432/restaurantos
      RESTAURANTOS_REDIS_URL: redis://redis:6379/0
      RESTAURANTOS_SECRET_KEY: local-compose-dev-secret-key-do-not-use-in-production

    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "restaurant_os.uber_availability_worker"]
    environment:
      RESTAURANTOS_ENVIRONMENT: local
      RESTAURANTOS_SERVICE_NAME: restaurant-os-uber-availability-worker
      RESTAURANTOS_DATABASE_URL: postgresql+psycopg://restaurantos:restaurantos@postgres:5432/restaurantos
      RESTAURANTOS_REDIS_URL: redis://redis:6379/0
      RESTAURANTOS_SECRET_KEY: local-compose-dev-secret-key-do-not-use-in-production
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurantos
      POSTGRES_USER: restaurantos
      POSTGRES_PASSWORD: restaurantos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
