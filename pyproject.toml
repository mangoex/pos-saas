[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Historical Alembic migrations are immutable records: they must not be
# rewritten for style. Only stylistic rules that are inherent to Alembic's
# contract are relaxed here (module-level `revision`/`down_revision` forces
# imports lower in the file -> E402; migration bodies are verbose -> E501;
# generated import order -> I001). Functional rules (F, B) remain active so
# real bugs in migrations still surface.
[tool.ruff.lint.per-file-ignores]
"apps/api/alembic/versions/*.py" = ["E402", "E501", "I001"]
# These tracked root scripts are historical, one-off local utilities. Their
# import placement is intentional (environment/bootstrap setup precedes app
# imports), and the updater scripts contain generated source code as strings.
# Keep product code under the full lint policy while avoiding rewrites to these
# non-runtime artifacts.
"test_dashboard.py" = ["I001"]
"test_extract.py" = ["I001"]
"update_backend.py" = ["E501", "F401", "UP015"]
"update_frontend.py" = ["E402", "E501", "F811", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api"
exclude = ["^scripts/"]
